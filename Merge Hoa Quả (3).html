<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merge Hoa Quả</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
:root{--bg1:#bfe6ff;--bg2:#ffe3f1;--card:rgba(255,255,255,.75);--text:#4a3550;--accent:#ff6b9a;--line:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg1:#27365a;--bg2:#4a2a4a;--card:rgba(20,16,36,.6);--text:#fff0f6}}
:root[data-theme="dark"]{--bg1:#27365a;--bg2:#4a2a4a;--card:rgba(20,16,36,.6);--text:#fff0f6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--text);font-family:"Baloo 2","Segoe UI",Arial,sans-serif;font-weight:600;display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
main{width:100%;max-width:440px;padding:10px 12px 24px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;text-align:center;font-weight:800;font-size:1.9rem;color:var(--accent)}
.hud{display:flex;gap:8px;align-items:stretch}
.box{flex:1;background:var(--card);border-radius:16px;padding:4px 10px;text-align:center;line-height:1.1}
.box small{display:block;font-size:.8rem;opacity:.75}
.box b{font-size:1.5rem;font-weight:800}
.next{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.next canvas{width:52px;height:52px}
#snd{flex:0 0 48px;border:0;border-radius:16px;background:var(--card);font-size:1.4rem;cursor:pointer}
.stage{position:relative;aspect-ratio:2/3;background:#ffe9c9 center/100% 100% no-repeat}
.play{position:absolute;left:9%;width:83%;top:25.8%;height:61.5%;border-radius:12px;overflow:hidden;background:linear-gradient(#d9ecff,#fff0f7)}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#warn{position:absolute;left:8px;right:8px;top:8px;text-align:center;background:#ff3b4e;color:#fff;border-radius:14px;padding:6px 8px;font-weight:800;animation:pulse .5s infinite alternate;pointer-events:none}
@keyframes pulse{from{opacity:.55;transform:scale(.98)}to{opacity:1;transform:scale(1.02)}}
.ov{position:absolute;inset:0;background:rgba(255,240,248,.88);color:#4a3550;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px}
.ov h2{margin:0;font-size:1.7rem;font-weight:800;color:#ff4f86}
.ov p{margin:0;font-size:.95rem}
[hidden]{display:none!important}
button.go{font:inherit;font-weight:800;font-size:1.3rem;background:var(--accent);color:#fff;border:0;border-radius:16px;padding:8px 30px;cursor:pointer}
button:focus-visible{outline:3px solid #4a90ff;outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="hud">
    <div class="box"><small>Điểm</small><b id="sc">0</b></div>
    <div class="box"><small>Kỷ lục</small><b id="bs">0</b></div>
    <div class="box next"><small>Tiếp theo</small><canvas id="nx" width="104" height="104"></canvas></div>
    <button id="snd" aria-label="Bật hoặc tắt âm thanh">🔊</button>
  </div>
  <div class="stage" id="stage"><div class="play">
    <canvas id="cv"></canvas>
    <div id="warn" hidden>⚠️ CẨN THẬN! CỐC SẮP TRÀN RỒI!</div>
    <div class="ov" id="start"><h2>Merge Hoa Quả</h2><p>Chạm hoặc nhấp để thả quả.<br>Hai quả giống nhau sẽ hợp thành quả lớn hơn!<br>Đừng để quả chạm vạch đỏ quá lâu nhé.</p><button class="go" id="go">Bắt đầu</button></div>
    <div class="ov" id="over" hidden><h2>Game Over!</h2><p id="ot"></p><button class="go" id="again">Chơi lại</button></div>
  </div></div>
  </main>

var RAD=[14,20,26,32,40,48,57,67,77,90],ISC=[1.08,1.08,1.1,1.1,1.08,1.1,1.15,1.08,1.12,1.3];
var NAMES=['Việt quất','Dâu tây','Quýt','Đào','Kiwi','Xoài','Thanh long','Dưa lưới','Sầu riêng','Trà trái cây'];
var LV=[['#9a95ee','#5a55b8'],['#ff6b7f','#c43a55'],['#ffa23a','#d9701a'],['#ffb8ab','#e27d78'],['#9be36d','#5aa63a'],['#ffd13d','#e29a14'],['#ff5fb2','#c22d82'],['#b8f0a0','#6cbf6a'],['#f6df6a','#c9a620'],['#fff0b0','#ff9fd0']];
var FACE=[[0,0],[0,1],[1,2],[2,1],[0,2],[0,1],[0,3],[2,2],[3,2],[0,2]];
var imgs={},$=function(i){return document.getElementById(i)};
var cv=$('cv'),c=cv.getContext('2d'),nx=$('nx'),nc=nx.getContext('2d');
var dpr=Math.min(window.devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;nx.width=nx.height=104;

/* ---------- âm thanh ---------- */
var ac=null,mute=false;
function tone(f,t0,d,type,v){if(mute||!ac)return;var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03)}
function sDrop(){tone(220,0,.1,'sine',.18);tone(150,.04,.1,'sine',.12)}
function sMerge(n,cb){var f=392*Math.pow(2,Math.min(n+cb,16)/9);tone(f,0,.18,'sine',.2);tone(f*1.5,.09,.28,'triangle',.18)}
function sBeep(){tone(880,0,.12,'square',.05)}
function sFan(n){var b=523*Math.pow(2,Math.min(n,10)/24);[0,4,7,12,16].forEach(function(s,i){tone(b*Math.pow(2,s/12),i*.07,.32,'triangle',.16)});tone(b*4,.38,.5,'sine',.12)}

/* ---------- vẽ quả ---------- */
function star(x,y,r){c2.beginPath();for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;c2.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c2.closePath()}
var c2=c;
function fruit(g,n,x,y,r,ang,sx,sy){
  c2=g;g.save();g.translate(x,y);g.rotate((ang||0)*.5);g.scale(sx||1,sy||1);
  var im=imgs[n];
  if(im){var k=r*2*(ISC[n-1]||1.1)/Math.max(im.width,im.height),w=im.width*k,h=im.height*k;g.drawImage(im,-w/2,-h/2,w,h);g.restore();return}
  var b=LV[n-1][0],d=LV[n-1][1];
  g.lineWidth=Math.max(2,r*.07);g.strokeStyle=d;
  /* chi tiết phía sau/trên */
  g.fillStyle='#5fcf6a';
  if([2,3,4,6].indexOf(n)>=0){g.beginPath();g.ellipse(r*.15,-r*.98,r*.32,r*.14,-.5,0,7);g.fill();g.fillRect(-r*.04,-r*1.05,r*.08,r*.15)}
  if(n===1){g.fillStyle='#4a46a8';g.beginPath();g.arc(0,-r*.9,r*.22,0,7);g.fill()}
  if(n===7||n===9){g.fillStyle=n===7?'#4fd37a':'#b88a3a';for(var k=-2;k<=2;k++){g.beginPath();g.moveTo(k*r*.28-r*.12,-r*.9);g.lineTo(k*r*.28,-r*(1.15-Math.abs(k)*.05));g.lineTo(k*r*.28+r*.12,-r*.9);g.fill()}}
  if(n===8){g.strokeStyle='#4fb858';g.lineWidth=r*.07;g.beginPath();g.moveTo(0,-r*.95);g.quadraticCurveTo(r*.1,-r*1.2,r*.3,-r*1.15);g.stroke();g.strokeStyle=d;g.lineWidth=Math.max(2,r*.07)}
  if(n===10){g.strokeStyle='#ff4f6a';g.lineWidth=r*.1;g.beginPath();g.moveTo(r*.3,-r*.8);g.lineTo(r*.55,-r*1.2);g.stroke();g.fillStyle='#3fcf80';g.beginPath();g.ellipse(-r*.1,-r*.98,r*.3,r*.13,-.4,0,7);g.fill();g.strokeStyle=d;g.lineWidth=Math.max(2,r*.07)}
  /* thân */
  g.fillStyle=b;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.stroke();
  if(n===5){g.fillStyle='#7a5a32';g.beginPath();g.arc(0,0,r,0,7);g.arc(0,0,r*.82,0,7,true);g.fill()}
  if(n===10){g.fillStyle='rgba(255,200,220,.7)';[[-.4,.5],[.35,.55],[0,.7]].forEach(function(p){g.beginPath();g.arc(p[0]*r,p[1]*r,r*.16,0,7);g.fill()})}
  var gr=g.createRadialGradient(0,0,r*.6,0,0,r);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.14)');g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.ellipse(-r*.45,-r*.5,r*.22,r*.13,-.7,0,7);g.fill();
  /* mặt */
  var f=FACE[n-1],ex=r*.34,ey=-r*.05,er=r*.2;
  g.fillStyle='rgba(255,120,150,.55)';[-1,1].forEach(function(s){g.beginPath();g.ellipse(s*r*.58,r*.25,r*.15,r*.1,0,0,7);g.fill()});
  g.lineCap='round';g.strokeStyle='#4a2a2a';g.lineWidth=Math.max(1.5,r*.06);
  [-1,1].forEach(function(s){
    var X=s*ex,t=f[0];
    if(t===2||(t===1&&s===1)){g.beginPath();g.arc(X,ey+er*.4,er*.9,Math.PI*1.1,Math.PI*1.9);g.stroke()}
    else if(t===3){g.fillStyle='#ffd400';star(X,ey,er*1.25);g.fill();g.fillStyle='#4a2a2a';g.beginPath();g.arc(X,ey,er*.35,0,7);g.fill()}
    else{g.fillStyle='#3a2020';g.beginPath();g.ellipse(X,ey,er*.85,er,0,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(X-er*.25,ey-er*.35,er*.3,0,7);g.fill();g.beginPath();g.arc(X+er*.25,ey+er*.3,er*.14,0,7);g.fill()}
  });
  var my=r*.3,m=f[1];
  if(m===0){g.fillStyle='#b83a50';g.beginPath();g.ellipse(0,my+r*.05,r*.09,r*.12,0,0,7);g.fill()}
  else if(m===1){g.beginPath();g.arc(0,my-r*.08,r*.16,.15*Math.PI,.85*Math.PI);g.stroke()}
  else if(m===2){g.fillStyle='#8b1d2c';g.beginPath();g.arc(0,my-r*.05,r*.2,0,Math.PI);g.closePath();g.fill();g.fillStyle='#ff8fa3';g.beginPath();g.ellipse(0,my+r*.12,r*.1,r*.06,0,0,7);g.fill()}
  else{g.beginPath();g.arc(-r*.08,my,r*.08,.1*Math.PI,Math.PI);g.stroke();g.beginPath();g.arc(r*.08,my,r*.08,0,.9*Math.PI);g.stroke()}
  g.restore();c2=c;
}

/* ---------- vật lý ---------- */
var engine=Engine.create();engine.gravity.y=1.1;
Comp.add(engine.world,[Bodies.rectangle(L-30,300,60,1200,{isStatic:true}),Bodies.rectangle(R+30,300,60,1200,{isStatic:true}),Bodies.rectangle(W/2,FLOOR+30,600,60,{isStatic:true,friction:.4})]);
function fruits(){return Comp.allBodies(engine.world).filter(function(b){return b.lvl})}
var state='start',score=0,best=0,maxL=1,cur=1,next=1,px=W/2,ready=true,dang=0,warn=false,lastBeep=0,combo=0,lastM=0,P=[];
try{best=parseInt(localStorage.getItem('mhq-best'),10)||0}catch(e){}
function rnd(){return 1+Math.floor(Math.random()*5)}
function mk(n,x,y){var b=Bodies.circle(x,y,RAD[n-1],{restitution:.15,friction:.25});b.lvl=n;b.t0=b.born=performance.now();Comp.add(engine.world,b);if(n>maxL)maxL=n;return b}
function showNext(){nc.clearRect(0,0,104,104);fruit(nc,next,52,52,RAD[next-1]*.95);c2=c}
function setScore(v){score=v;$('sc').textContent=v;if(v>best){best=v;$('bs').textContent=v;try{localStorage.setItem('mhq-best',v)}catch(e){}}}
function drop(){
  if(state!=='play'||!ready)return;
  var r=RAD[cur-1],x=Math.max(L+r+2,Math.min(R-r-2,px)),b=mk(cur,x,46);Body.setVelocity(b,{x:0,y:2});sDrop();
  cur=next;next=rnd();showNext();ready=false;setTimeout(function(){ready=true},480);
}
var made={},toasts=[];
function praise(n,x,y){var ex=n>=7;toasts.push({t:ex?'Excellent!':'Great!',nm:NAMES[n-1],x:x,y:y,life:1,col:ex?'#ff3d8b':'#ff9f1a'});sFan(n);burst(x,y,n+5)}
var COLS=['#ff5d8f','#ffd23f','#5ee1ff','#7dff8a','#c58bff','#ff9f43'];
function burst(x,y,n){var k=20+n*5;for(var i=0;i<k;i++){var a=Math.PI*2*i/k+Math.random()*.3,s=2+Math.random()*(3+n*.4);P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:COLS[i%6],st:i%3===0,sz:3+Math.random()*3})}}
function merge(a,b){
  a.dead=b.dead=true;Comp.remove(engine.world,a);Comp.remove(engine.world,b);
  var n=a.lvl+1,x=(a.position.x+b.position.x)/2,y=(a.position.y+b.position.y)/2,now=performance.now();
  combo=now-lastM<1500?combo+1:1;lastM=now;
  mk(n,x,y);setScore(score+n*n+(combo-1)*5);sMerge(n,combo);burst(x,y,n);if(!made[n]){made[n]=1;praise(n,x,y)}
  if(n===10){setTimeout(function(){burst(x-60,y-40,10);sMerge(12,3)},200);setTimeout(function(){burst(x+60,y-60,10);sMerge(14,4)},400)}
}
Events.on(engine,'collisionStart',function(e){e.pairs.forEach(function(p){var a=p.bodyA,b=p.bodyB;if(a.lvl&&a.lvl===b.lvl&&a.lvl<10&&!a.dead&&!b.dead)merge(a,b)})});

function checkDanger(dt){
  var now=performance.now(),over=false;
  fruits().forEach(function(b){if(now-b.t0>1000&&b.position.y-b.circleRadius<DANGER)over=true});
  dang=over?dang+dt:Math.max(0,dang-dt*2);
  warn=dang>2000;$('warn').hidden=!warn;
  if(warn&&now-lastBeep>600){sBeep();lastBeep=now}
  if(dang>4000)gameOver();
}
function gameOver(){state='over';warn=false;$('warn').hidden=true;$('ot').innerHTML='Điểm: <b>'+score+'</b><br>Kỷ lục: '+best+'<br>Cấp cao nhất: '+maxL+' – '+NAMES[maxL-1];$('over').hidden=false}
function reset(){
  fruits().forEach(function(b){Comp.remove(engine.world,b)});
  P=[];made={};toasts=[];setScore(0);maxL=1;dang=0;warn=false;combo=0;cur=rnd();next=rnd();showNext();ready=true;
  $('over').hidden=true;$('start').hidden=true;$('warn').hidden=true;state='play';
}

/* ---------- vẽ khung hình ---------- */
function cup(t){
  var pl=.5+.5*Math.sin(t/110),col=warn?'rgb(255,'+(50+pl*50|0)+','+(60+pl*40|0)+')':'#8fd3ff';
  c.save();c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.moveTo(L,TOP);c.lineTo(L,FLOOR-26);c.quadraticCurveTo(L,FLOOR,L+26,FLOOR);c.lineTo(R-26,FLOOR);c.quadraticCurveTo(R,FLOOR,R,FLOOR-26);c.lineTo(R,TOP);c.fill();
  c.lineWidth=7;c.lineJoin='round';c.strokeStyle=col;if(warn){c.shadowColor='#f00';c.shadowBlur=10+pl*20}c.stroke();c.restore();
  c.save();c.setLineDash([10,8]);c.lineWidth=3;c.strokeStyle=warn?col:'rgba(255,100,130,.75)';if(warn){c.shadowColor='#f00';c.shadowBlur=8+pl*16}c.beginPath();c.moveTo(L,DANGER);c.lineTo(R,DANGER);c.stroke();c.restore();
}
var last=performance.now(),acc=0;
function frame(t){
  var dt=Math.min(50,t-last);last=t;
  if(state==='play'){acc+=dt;while(acc>=16.67){Engine.update(engine,16.67);acc-=16.67}checkDanger(dt)}
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);cup(t);
  var now=performance.now();
  fruits().forEach(function(b){
    var k=(now-b.born)/500,s=k<1?1+.3*Math.sin(k*Math.PI*3)*(1-k):1;
    fruit(c,b.lvl,b.position.x,b.position.y,b.circleRadius,b.angle,s,1/s);
  });
  if(state==='play'&&ready){
    var r=RAD[cur-1],x=Math.max(L+r+2,Math.min(R-r-2,px));
    c.save();c.setLineDash([4,8]);c.strokeStyle='rgba(120,90,140,.35)';c.lineWidth=2;c.beginPath();c.moveTo(x,46+r);c.lineTo(x,FLOOR);c.stroke();c.restore();
    fruit(c,cur,x,46,r);
  }
  for(var i=P.length-1;i>=0;i--){
    var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.vx*=.98;p.life-=dt/700;
    if(p.life<=0){P.splice(i,1);continue}
    c.globalAlpha=p.life;c.fillStyle=p.col;c2=c;
    if(p.st){star(p.x,p.y,p.sz*1.6);c.fill()}else{c.beginPath();c.arc(p.x,p.y,p.sz*p.life,0,7);c.fill()}
  }
  c.globalAlpha=1;
  for(var j=toasts.length-1;j>=0;j--){var q=toasts[j];q.life-=dt/1300;if(q.life<=0){toasts.splice(j,1);continue}
    var kk=1-q.life,sc=kk<.15?.6+kk/.15*.6:1.2-Math.min(.2,(kk-.15)*.5),xx=Math.max(90,Math.min(W-90,q.x)),yy=Math.max(70,q.y)-kk*50;
    c.save();c.globalAlpha=Math.min(1,q.life*2.5);c.translate(xx,yy);c.scale(sc,sc);c.textAlign='center';c.lineJoin='round';
    c.font='800 34px "Baloo 2",sans-serif';c.lineWidth=7;c.strokeStyle='#fff';c.strokeText(q.t,0,0);c.fillStyle=q.col;c.fillText(q.t,0,0);
    c.font='800 16px "Baloo 2",sans-serif';c.lineWidth=5;c.strokeText(q.nm,0,22);c.fillStyle='#6a4a7a';c.fillText(q.nm,0,22);c.restore()}
  requestAnimationFrame(frame);
}

/* ---------- điều khiển ---------- */
function setX(e){var r=cv.getBoundingClientRect();px=(e.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',setX);
cv.addEventListener('pointermove',setX);
cv.addEventListener('pointerup',function(e){setX(e);drop()});
$('go').onclick=function(){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}reset()};
$('again').onclick=reset;
$('snd').onclick=function(){mute=!mute;this.textContent=mute?'🔇':'🔊'};

/* ---------- ảnh nhân vật ---------- */
(window.__IMGS||[]).forEach(function(u,i){var im=new Image();im.onload=function(){imgs[i+1]=im;showNext()};im.src=u});

$('bs').textContent=best;cur=rnd();next=rnd();showNext();$('stage').style.backgroundImage='url('+window.__FRAME+')';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
